        const goal = this.manualTilt != null ? this.manualTilt : (this.targetTilt || 0);
        const tilt = s.tilt + (goal - s.tilt) * kt;
        const energy = Math.min(1, s.energy * Math.exp(-dt / 1100) + Math.abs(tilt - s.tilt) * 3);
        // 컵처럼: 이 기울기에서 화면에 담을 수 있는 양(cap)을 넘는 물만 쏟아진다. 다 기울여도 낮은 구석에 조금은 남는다
        const at = Date.now();
        const before = this.levelAt(at);
        if (before < REARM) this.armed = true;
        const excess = before - this.capacity(Math.tan(Math.max(-1.48, Math.min(1.48, tilt))));
        if (this.pourOn !== false && excess > 0.001) {
          const base = Math.max(0, before - Math.min(excess, Math.max(excess * SPILL_RATE, POUR_MIN) * dt / 1000));
          // 쏟은 양을 모아 한 칸(STEP)이 될 때마다 두드린 수를 하나 덜어 낸다. 저절로 줄어든 물은 덜지 않는다
          this.poured = (this.poured || 0) + (before - base);
          const drop = POUR_TAKES_TAPS ? Math.floor(this.poured / STEP) : 0;
          this.poured -= drop * STEP;
          return { base, last: at - GRACE_MS, count: Math.max(0, s.count - drop), shown: s.shown + (base - s.shown) * k, tilt, energy: Math.min(1, energy + excess * 0.1) };
        }
        return { shown: s.shown + (this.levelAt(Date.now()) - s.shown) * k, tilt, energy };
      });
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
  }
  componentWillUnmount() {
    window.removeEventListener('deviceorientation', this.onTilt);
    cancelAnimationFrame(this.raf);
  }
  // 물 윗면 계산. 칸마다 높이와 속도를 두고 작은 시간 간격으로 나눠 푼다
  stepWater(dt) {
    if (!this.wh) { this.wh = new Array(COLS).fill(0); this.wv = new Array(COLS).fill(0); this.bh = new Array(COLS).fill(0); this.drops = []; this.idle = 0; }
    const h = this.wh, v = this.wv;
    this.idle += dt;
    // 물이 빠질 때도 찰랑인다. 빠진 만큼 몇 칸을 흔들고, 기울여 쏟을 때는 낮은 쪽으로 출렁인다
    const shownNow = this.state ? this.state.shown : 0;
    const drained = Math.max(0, (this.lastShown == null ? shownNow : this.lastShown) - shownNow) * 844;
    this.lastShown = shownNow;
    if (drained > 0.05 && shownNow > 0.002) {
      for (let k = 0; k < 3; k++) v[Math.floor(Math.random() * COLS)] += (Math.random() - 0.5) * Math.min(drained, 6) * 160;
      const lean = this.state.tilt || 0;
      if (Math.abs(lean) > 0.05) for (let i = 0; i < COLS; i++) v[i] += Math.sign(lean) * Math.min(drained, 6) * 14 * ((i - (COLS - 1) / 2) / ((COLS - 1) / 2));
    }
    if (this.idle > 500) { this.idle = 0; v[Math.floor(Math.random() * COLS)] += (Math.random() - 0.5) * 40; }
    const sub = Math.max(1, Math.ceil(dt / 8));
    const step = dt / 1000 / sub;
    for (let k = 0; k < sub; k++) {
      for (let i = 0; i < COLS; i++) {
        const l = h[i > 0 ? i - 1 : i], r = h[i < COLS - 1 ? i + 1 : i];
        v[i] += (-SPRING * h[i] - DAMP * v[i] + SPREAD * (l + r - 2 * h[i])) * step;
      }
      for (let i = 0; i < COLS; i++) h[i] = Math.max(-70, Math.min(70, h[i] + v[i] * step));
    }
    // 뒤쪽 물결은 앞 물결을 조금 늦게, 옆으로 비켜 따라가 깊이감을 낸다
    const kb = 1 - Math.exp(-dt / 200);
    for (let i = 0; i < COLS; i++) this.bh[i] += (h[Math.min(COLS - 1, i + 3)] * 0.75 - this.bh[i]) * kb;
    // 물방울: 튀어 올랐다가 떨어지고, 물에 닿으면 그 자리에 작은 물결을 낸다
    const slope = Math.tan(Math.max(-1.48, Math.min(1.48, this.state ? this.state.tilt : 0)));
    const top = this.surfaceAt(this.state ? this.state.shown : 0, slope);
    const sec = dt / 1000;
    this.drops = this.drops.filter((d) => {
      d.vy += GRAVITY * sec; d.x += d.vx * sec; d.y += d.vy * sec;
      const col = Math.max(0, Math.min(COLS - 1, Math.round(d.x / 390 * (COLS - 1))));
      const surface = top + (d.x - 195) * slope + h[col];
      if (d.vy > 0 && d.y >= surface) { v[col] += 30 + d.r * 8; return false; }
      return d.x > -10 && d.x < 400 && d.y < 900;
    });
  }
  // 누른 자리와 방향에 따라 물을 민다. 물속을 누르면 솟고, 물 위를 누르면 눌린다. 누른 쪽 반대편으로 쏠린다
  kick(x, y, top, power) {
    if (!this.wh) this.stepWater(0);
    const c = x / 390 * (COLS - 1);
    const near = Math.max(0.35, 1 - Math.abs(y - top) / 420);
    const sign = y > top ? -1 : 1;
    const side = x < 195 ? -1 : 1;
    const width = 2.4 + Math.random() * 2;
    // 수면 가까이를 두드리면 물방울이 몇 개 튄다
    if (top < 838 && Math.abs(y - top) < 220) {
      const n = Math.round((2 + Math.random() * 3) * Math.min(2, power));
      for (let k = 0; k < n && this.drops.length < 40; k++) {
        this.drops.push({ x: x + (Math.random() - 0.5) * 24, y: top, vx: (Math.random() - 0.5) * 180, vy: -(220 + Math.random() * 280) * Math.min(1.6, power), r: 2 + Math.random() * 3 });
      }
    }
    for (let i = 0; i < COLS; i++) {
      const d = i - c;
      this.wv[i] += sign * KICK * power * near * Math.exp(-(d * d) / (2 * width * width));
      this.wv[i] += SLOSH * power * side * ((i - (COLS - 1) / 2) / ((COLS - 1) / 2)) * (0.6 + Math.random() * 0.4);
    }
  }
  // 가득 찬 순간의 흔들림
  impact(now) {
    const sa = (now - (this.state.shakeAt || -1e9)) / SHAKE_MS;
    const sh = sa < 1 && this.shakeOn !== false ? SHAKE_PX * (1 - sa) * (1 - sa) : 0;
    return {
      shx: (sh * Math.sin(now / 17)).toFixed(1) + 'px', shy: (sh * Math.cos(now / 23)).toFixed(1) + 'px'
    };
  }
  // 점들을 지나는 부드러운 곡선(캣멀롬을 베지어로)
  smooth(pts) {
    const f = (n) => n.toFixed(1);
    let d = 'M' + f(pts[0][0]) + ',' + f(pts[0][1]);
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      d += ' C' + f(p1[0] + (p2[0] - p0[0]) / 6) + ',' + f(p1[1] + (p2[1] - p0[1]) / 6) + ' ' + f(p2[0] - (p3[0] - p1[0]) / 6) + ',' + f(p2[1] - (p3[1] - p1[1]) / 6) + ' ' + f(p2[0]) + ',' + f(p2[1]);
    }
    return d;
  }
  maxLife(p) { return p.kind === 'complete' ? 1700 : p.kind === 'rare' ? 1400 : POP_MS; }
  // 물의 양(level)과 기울기(m = tan)로 가운데(x=195) 수면 높이를 찾는다. 기울어도 물의 넓이는 그대로다
  waterArea(c, m) {
    let a = 0;
    for (let i = 0; i < 40; i++) { const y = c + ((i + 0.5) * 390 / 40 - 195) * m; a += 844 - Math.max(0, Math.min(844, y)); }
    return a / (40 * 844);
  }
  surfaceAt(level, m) {
    let lo = -844 - 195 * Math.abs(m), hi = 844 + 195 * Math.abs(m);
    for (let k = 0; k < 30; k++) { const mid = (lo + hi) / 2; if (this.waterArea(mid, m) > level) lo = mid; else hi = mid; }
    return (lo + hi) / 2;
  }
  // 이 기울기에서 넘치지 않고 담기는 양: 높은 쪽 가장자리가 화면 위 끝에 닿을 때까지
  capacity(m) { return this.waterArea(195 * Math.abs(m), m); }
  levelAt(now) {
    const idle = now - this.state.last - GRACE_MS;
    if (idle <= 0) return this.state.base;
    return Math.max(0, this.state.base - DECAY * idle / 1000);
  }
  // 문구 하나의 수명. 뒤에 새 문구가 나오면 줄어든다
  lifeOf(i, n) {
    const newer = n - 1 - i;
    // 겁치지 않게 놓으므로 앞 문구를 크게 줄일 필요가 없다. 너무 줄이면 나오자마자 사라져 빠진 것처럼 보인다
    return newer === 0 ? POP_MS : newer === 1 ? POP_MS * 0.85 : POP_MS * 0.7;
  }
  // 지금 눈에 보이는 문구만, 지금 자리(떠오른 만큼 포함)로
  visible(now) {
    const all = this.state.pops;
    return all.map((p, i) => ({ p, a: (now - p.t) / this.lifeOf(i, all.length) }))
      .filter(({ a }) => a < 0.7)
      .map(({ p, a }) => this.box(p.text, p.size, p.x, p.y - a * RISE));
  }
  // 문구가 차지하는 상자
  box(text, size, x, y) {
    const w = text.length * size * 0.95 + 12;
    const h = size * 1.2;
    return { l: x - w / 2, r: x + w / 2, t: y - h / 2, b: y + h / 2 };
  }
  // 누른 자리에서 가까운 순서로 살펴 떠 있는 문구와 안 겹치는 첫 자리. 없으면 null (그때는 띄우지 않는다)
  freeSpot(text, size, x, y) {
    const taken = this.visible(Date.now());
    // 누른 자리에서 가까운 순서로. 위아래 70px, 좌우 100px 간격
    const steps = [];
    for (let sy = -4; sy <= 4; sy++) for (let sx = -2; sx <= 2; sx++) steps.push([sx, sy]);
    steps.sort((a, b) => (a[0] * 100) ** 2 + (a[1] * 70) ** 2 - ((b[0] * 100) ** 2 + (b[1] * 70) ** 2));
    for (const [sx, sy] of steps) {
      const half = text.length * size * 0.475 + 8;
      const cx = Math.max(half + 8, Math.min(390 - half - 8, x + sx * 100));
      // 한쪽을 누르면 문구도 그쪽에 남는다. 가운데로 넘어가지 않는다
      if (Math.abs(x - 195) > 60 && (cx - 195) * (x - 195) < 0) continue;
      const cy = Math.max(150, Math.min(700, y + sy * 70));
      const b = this.box(text, size, cx, cy);
      if (taken.every((o) => b.r <= o.l || b.l >= o.r || b.b <= o.t || b.t >= o.b)) return [cx, cy];
    }
    return null;
  }
  // 바탕 문장 단위로 고른다. 최근에 나온 바탕은 건너뛰고, 고른 바탕의 변형 하나를 무작위로 보여 준다
  pickFrom(name, groups) {
    this.recentBases = this.recentBases || [];
    const keep = Math.min(RECENT_BASES, Math.floor(groups.length / 2));
    const recent = this.recentBases.slice(-keep);
    const fresh = [];
    for (let i = 0; i < groups.length; i++) if (!recent.includes(name + i)) fresh.push(i);
    const i = fresh.length ? fresh[Math.floor(Math.random() * fresh.length)] : Math.floor(Math.random() * groups.length);
    this.recentBases = [...this.recentBases, name + i].slice(-RECENT_BASES);
    const g = groups[i];
    return g[Math.floor(Math.random() * g.length)];
  }
  pick(level) {
    return level >= 1 ? this.pickFrom('full', CHEERS.full) : level >= 0.5 ? this.pickFrom('high', CHEERS.high) : this.pickFrom('low', CHEERS.low);
  }
  renderVals() {
    P = themePalette(this.props && this.props.theme);
    return Object.assign({ p: P }, this.renderVals0());
  }
  renderVals0() {
    const now = Date.now();
    const level = this.state.shown;
    // 찰랑이는 물 윗면. 두 사인파를 겹치고, 두드릴 때마다 출렁임이 커졌다가 잦아든다. 평평한 단색만 쓴다
    let waterPath = '';
    let edgePath = '';
    let backPath = '';
    if (level > 0.002) {
      const slope = Math.tan(Math.max(-1.48, Math.min(1.48, this.state.tilt)));
      const top = this.surfaceAt(level, slope);
      const calm = 1;
      const hs = this.wh || new Array(COLS).fill(0);
      const bs = this.bh || hs;
      const front = [], back = [];
      for (let i = 0; i < COLS; i++) {
        const x = i * 390 / (COLS - 1);
        const base = top + (x - 195) * slope;
        front.push([x, Math.max(-30, Math.min(874, base + hs[i] * calm))]);
        back.push([x, Math.max(-30, Math.min(874, base - 5 * calm + bs[i] * calm))]);
      }
      edgePath = this.smooth(front);
      waterPath = edgePath + ' L390,874 L0,874 Z';
      backPath = this.smooth(back) + ' L390,874 L0,874 Z';
    }
    const sinceTap = now - this.state.last;
    let pose = ['idle', '가만히'];
    if (this.levelAt(now) >= 1) pose = ['finish', '가득 참'];
    else if (sinceTap < 160) pose = ['react', '두드릴 때'];
    else if (level >= 0.5) pose = ['palmsTogether', '절반 넘음'];
    const alive = this.state.pops.filter((p) => now - p.t < this.maxLife(p));
    const pops = alive.map((p, i) => {
      // 뒤에 새 문구가 나오면 앞 문구는 수명을 줄여 빨리 흐려진다
      const a = Math.min(1, (now - p.t) / (p.kind ? this.maxLife(p) : this.lifeOf(i, alive.length)));
      // 작게 나타나 살짝 넘치게 커졌다가 자리를 잡고, 사라질 때까지 조금씩 더 커진다
      const g = Math.min(1, a / 0.35);
      const back = 1 + 2.2 * Math.pow(g - 1, 3) + 1.2 * Math.pow(g - 1, 2);
      const pop = 0.45 + 0.55 * back + 0.1 * a;
      return {
        text: p.text, x: p.x + 'px', y: p.y + 'px', size: p.size + 'px', rot: p.rot + 'deg',
        starDisp: p.kind === 'rare' ? 'block' : 'none', spin: ((now - p.t) / 20).toFixed(1) + 'deg',
        bg: p.kind === 'rare' ? P.ink : 'transparent', fg: p.kind === 'rare' ? P.ground : P.ink,
        pad: p.kind === 'rare' ? '10px 22px 12px' : '0',
        scale: pop.toFixed(3), rise: (-a * RISE).toFixed(1) + 'px',
        alpha: (a < 0.6 ? 1 : 1 - (a - 0.6) / 0.4).toFixed(3)
      };
    });
    return {
      waterPath, edgePath, backPath,
      noteBack: this.state.filled ? 'flex' : 'none',
      noteOpen: this.state.noteOpen ? 'flex' : 'none',
      note: this.state.note,
      openNote: () => this.setState({ noteOpen: true }),
      onNote: (e) => this.setState({ note: e.target.value }),
      presets: NOTE_PRESETS.map((text) => ({
        text, on: this.state.note === text ? 'true' : 'false',
        bg: this.state.note === text ? P.ink : P.surface, fg: this.state.note === text ? P.ground : P.ink,
        pick: () => this.setState({ note: text })
      })),
      drops: (this.drops || []).map((d) => ({ x: d.x.toFixed(1) + 'px', y: d.y.toFixed(1) + 'px', s: (d.r * 2).toFixed(1) + 'px' })),
      tiltDeg: this.manualTilt != null ? String(Math.round(-this.manualTilt * 180 / Math.PI)) : '0',
      onTilt: (e) => { this.manualTilt = -Number(e.target.value) * Math.PI / 180; },
      ...this.impact(now),
      surface: level > 0.01 && level < 0.995 ? '1' : '0',
      count: this.state.count,
      poseAlt: pose[0] + ' · ' + pose[1],
      poseScale: sinceTap < 90 ? '0.97' : '1',
      hint: this.state.count > 130 ? '0' : '1',
      pops,
      tap: (e) => {
        const t = Date.now();
        const rect = e && e.currentTarget ? e.currentTarget.getBoundingClientRect() : null;
        const x = rect && e.clientX ? (e.clientX - rect.left) / rect.width * 390 : 195 + (Math.random() - 0.5) * 160;
        const y = rect && e.clientY ? (e.clientY - rect.top) / rect.height * 844 : 380 + (Math.random() - 0.5) * 200;
        const next = Math.min(1, this.levelAt(t) + STEP);
        const wasFull = this.levelAt(t) >= 1;
        const justFilled = next >= 1 && !wasFull && this.armed !== false;
        if (justFilled) this.armed = false;
        const update = { base: next, last: t, count: this.state.count + 1, energy: Math.min(1, this.state.energy + 0.35) };
        // 아이폰 사파리는 기울기 값을 쓰려면 첫 두드림에서 허락을 받아야 한다
        if (!this.askedTilt && typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
          this.askedTilt = true;
          DeviceOrientationEvent.requestPermission().catch(() => {});
        }
        {
          // 누른 자리가 비어 있으면 바로 그 자리에. 막혀 있으면 게이지만 채운다. 가득 찬 순간만 가까운 빈자리를 찾는다
          // 가득 찬 그 한 번은 따로 고른 큰 말, 가끔은 별 다섯 개 문구. 그 밖에는 찰수록 글씨가 커진다
          const rare = !justFilled && Math.random() < RARE_CHANCE;
          const from = (list) => list[Math.floor(Math.random() * list.length)];
          const text = justFilled ? this.pickFrom('complete', COMPLETE) : rare ? this.pickFrom('rare', RARE) : this.pick(next);
          // 처음엔 작게(18) 시작해 차오를수록 빨리 커진다(절반에서 35, 거의 찼을 때 60)
          const want = justFilled ? 76 : Math.round(18 + Math.pow(next, 1.3) * 42) + (rare ? 6 : 0);
          // 긴 문구가 화면 폭을 다 차지하면 가운데로 밀리므로, 한 문구는 화면 폭의 60% 안으로 줄인다. 가득 찬 말만 90%
          const big = Math.round(Math.min(want * (this.textScale || 1), 390 * (justFilled ? 0.9 : 0.6) / (text.length * 0.95)));
          const tilt = Math.tan(Math.max(-1.48, Math.min(1.48, this.state.tilt)));
          const top = this.surfaceAt(this.state.shown, tilt) + (x - 195) * tilt;
          this.kick(x, y, top, justFilled ? 2.2 : wasFull ? FULL_KICK : 1);
          if (justFilled) { update.shakeAt = t; update.filled = true; }
          if (this.cheersOn === false) { this.setState(update); return; }
          // 누를 때마다 반드시 나온다. 빈자리가 없으면 가장 오래된 문구를 치우고 누른 자리에
          const found = justFilled ? [195, 360] : this.freeSpot(text, big, x, y - 50);
          const half = text.length * big * 0.475 + 8;
          const spot = found || [Math.max(half + 8, Math.min(390 - half - 8, x)), Math.max(150, Math.min(700, y - 50))];
          const live = this.state.pops.filter((p) => t - p.t < this.maxLife(p));
          const kept = justFilled ? [] : found ? live : live.slice(1);
          {
            const pop = { t, text, x: spot[0], y: spot[1], size: big, kind: justFilled ? 'complete' : rare ? 'rare' : '', rot: justFilled ? -4 : Math.round((Math.random() - 0.5) * 8) };
            update.pops = [...kept, pop].slice(-POP_MAX);
            update.recent = [...this.state.recent, text].slice(-8);
            update.lastPop = t;
          }
        }
        this.setState(update);
      }
    };
  }
}
