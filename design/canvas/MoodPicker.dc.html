<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>기분 고르기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:Pretendard;src:url(/_blob/eac3a98fdd643af8c80b7f3daead90fa);font-weight:400}
@font-face{font-family:Pretendard;src:url(/_blob/6dd9f1d0495ff325d173b1d71cb974c9);font-weight:700}
body{margin:0}
a,button{-webkit-tap-highlight-color:transparent;outline:none}
a:focus-visible,button:focus-visible{outline:2px solid #16161A;outline-offset:2px}
.press{transition:transform 90ms ease-out,filter 90ms ease-out}.press:active{transform:scale(0.98);filter:brightness(0.94)}.tap{transition:transform 90ms ease-out,filter 90ms ease-out}.tap:active{transform:scale(0.92);filter:brightness(0.9)}

a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 64px 24px 32px; background: {{p.ground}}; color: {{p.ink}}; font-family: Pretendard, system-ui, sans-serif; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 13px; color: {{p.muted}}">11월 18일 수요일</div>
<h1 style="margin: 0; font-size: 34px; font-weight: 700; line-height: 1.2">오늘 기분은</h1>
</div>
<div style="display: flex; gap: 4px">
<a class="tap" href="Map.dc.html" aria-label="내 주변 지도" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: {{p.surface}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{p.ink}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"></path><path d="M9 4v14M15 6v14"></path></svg>
</a>
<a class="tap" href="Calendar.dc.html" aria-label="달력" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: {{p.surface}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{p.ink}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>
</a>
<a class="tap" href="Settings.dc.html" aria-label="설정" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: {{p.surface}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{p.ink}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2.5v3M12 18.5v3M4.2 6.5l2.6 1.5M17.2 16l2.6 1.5M4.2 17.5 6.8 16M17.2 8l2.6-1.5"></path></svg>
</a>
</div>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{moods}}" as="m" hint-placeholder-count="5">
<a href="Tap.dc.html" class="press" style="flex: 1 1 0; display: flex; align-items: center; gap: 16px; padding: 0 24px; border-radius: 24px; background: {{p.surface}}">
<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="{{m.color}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M9 10h.01M15 10h.01" stroke-width="2.4"></path><path d="{{m.brow}}"></path><path d="{{m.mouth}}"></path></svg>
<div style="flex-grow: 1; font-size: 22px; font-weight: 700">{{m.label}}</div>
<div style="font-size: 13px; color: {{p.muted}}">{{m.count}}</div>
</a>
</sc-for>
</div>
</div>
</x-dc>

</body>
