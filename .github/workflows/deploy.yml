name: deploy
# Ships what main just built, then publishes the site.
#
# ci calls this as soon as its `check` job has built and tested the APK on a push to main
# (with branch protection, that is a merged pull request). It does not wait for the Apple
# builds, which have nothing to do with the APK. The artifact comes from the same run, so
# the tested APK ships and nothing is rebuilt. It becomes a GitHub release, and site/ goes
# to GitHub Pages with that APK copied into download/, so the page hands out the release it
# names from its own origin (no 302 to another host, which iOS turns into a cross-origin tab).
#
# workflow_dispatch republishes the site only (for copy changes), with the newest release.
# ios-test calls it this way after it attaches mood-clicker.ipa to the release of the same
# commit. The page offers the iPhone download only when the newest release carries that file.
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
  actions: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    # Never let two deploys race, and never cancel one in flight.
    concurrency:
      group: deploy
      cancel-in-progress: false
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      # Called from ci on a push: release. Run by hand: page only.
      IS_RELEASE: ${{ github.event_name == 'push' }}
      SHA: ${{ github.sha }}
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: fetch the tested APK
        if: env.IS_RELEASE == 'true'
        uses: actions/download-artifact@v4
        with:
          name: mood-clicker-debug-apk
          path: dist
      - name: release it
        if: env.IS_RELEASE == 'true'
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          mv dist/app-debug.apk dist/mood-clicker.apk
          gh release create "v$version-build.$BUILD" dist/mood-clicker.apk --target "$SHA" --latest \
            --title "$version (build $BUILD)" \
            --notes "Debug build of main ${SHA::7}, made and tested by ci run $BUILD."
      - name: keep the latest 10 releases
        if: env.IS_RELEASE == 'true'
        run: gh release list --limit 100 --json tagName --jq '.[10:][].tagName' | xargs -r -n1 gh release delete --yes --cleanup-tag
      # The page reads build.json for its version line, so it always names the APK it serves.
      - name: assemble the site with the newest release
        run: |
          mkdir -p _site/download
          cp -R site/. _site/
          tag=$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName // empty')
          if [ -z "$tag" ]; then
            echo "no release yet: publishing the page without a download"
            exit 0
          fi
          gh release download "$tag" -D _site/download --pattern 'mood-clicker.apk'
          ios=false
          if [ "$(gh release view "$tag" --json assets --jq '[.assets[].name] | index("mood-clicker.ipa") != null')" = "true" ]; then
            gh release download "$tag" -D _site/download --pattern 'mood-clicker.ipa'
            ios=true
          fi
          gh release view "$tag" --json tagName,targetCommitish,publishedAt | jq --argjson ios "$ios" '{
              version: (.tagName | sub("^v"; "") | sub("-build\\.[0-9]+$"; "")),
              build: (.tagName | capture("build\\.(?<n>[0-9]+)$").n),
              sha: .targetCommitish,
              date: (.publishedAt | fromdateiso8601 + 32400 | strftime("%Y-%m-%d %H:%M")),
              ios: $ios
            }' > _site/build.json
          cat _site/build.json
          ls -l _site/download
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: pages
        uses: actions/deploy-pages@v4
